apply plugin: 'com.android.application'

// ---- 直接把整个 data_asset 作为 APK 的 assets 源目录 ----
// 移动端运行时通过 AssetManager::LoadResource("Shader/xxx.spirv.gnxasset") 读取，
// 运行时路径固定为 Shader/ 前缀（见 ShaderAssetLoader::MakeShaderContainerPath）。
// AAPT 打包会把 srcDir 内的文件按相对路径打进 APK 的 assets/ 根：
//   data_asset/Shader/xxx.spirv.gnxasset → assets/Shader/xxx.spirv.gnxasset
// 这样自动保留 Shader/ 这一级子目录，也无需额外 Copy 任务。
def dataAssetDir = file('../../../../data_asset')

android {
    namespace "com.gnxengine.terrain"
    compileSdkVersion 35
    defaultConfig {
        applicationId "com.gnxengine.terrain"
        minSdkVersion 24
        targetSdkVersion 35
        versionCode 1
        versionName "1.0"
        externalNativeBuild {
            cmake {
                arguments "-DANDROID_APP_PLATFORM=android-24", "-DANDROID_STL=c++_static"
                abiFilters 'arm64-v8a', 'x86_64', 'x86'
            }
        }
    }
    buildTypes {
        debug {
            // 启用 native (C/C++) 调试，让 LLDB 能找到符号文件
            debuggable true
            jniDebuggable true
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
    sourceSets.main {
        jniLibs.srcDir 'libs'
        assets.srcDirs += dataAssetDir
    }
    externalNativeBuild {
        cmake {
            path 'jni/CMakeLists.txt'
        }
    }
    packagingOptions {
        jniLibs {
            keepDebugSymbols += '**/*.so'
        }
    }
}

dependencies {
}
