apply plugin: 'com.android.application'

android {
    namespace "com.gnxengine.terrain"
    compileSdkVersion 35
    defaultConfig {
        applicationId "com.gnxengine.terrain"
        minSdkVersion 24
        targetSdkVersion 35
        versionCode 1
        versionName "1.0"
        externalNativeBuild {
            cmake {
                arguments "-DANDROID_APP_PLATFORM=android-24", "-DANDROID_STL=c++_static"
                abiFilters 'arm64-v8a', 'x86_64', 'x86'
            }
        }
    }
    buildTypes {
        debug {
            // 启用 native (C/C++) 调试，让 LLDB 能找到符号文件
            debuggable true
            jniDebuggable true
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
    sourceSets.main {
        jniLibs.srcDir 'libs'
    }
    externalNativeBuild {
        cmake {
            path 'jni/CMakeLists.txt'
        }
    }
}

dependencies {
}
