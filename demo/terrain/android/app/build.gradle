apply plugin: 'com.android.application'

// ---- 打包预编译 shader（SPIRV 容器）到 assets/Shader/ ----
// 移动端运行时通过 AssetManager::LoadResource("Shader/xxx.spirv.gnxasset") 读取，
// Android 端这些文件必须随 APK 打进 assets 目录（AAssetManager 才能读到）。
// 只拷贝 spirv 格式，输出到 build/generated 不污染仓库。
def shaderSrcDir = file('../../../../data_asset/Shader')
def shaderOutDir = file("$buildDir/generated/assets/Shader")

task copyShaderAssets(type: Copy) {
    from(shaderSrcDir) {
        include '*.spirv.gnxasset'
    }
    into shaderOutDir
}

preBuild.dependsOn copyShaderAssets

android {
    namespace "com.gnxengine.terrain"
    compileSdkVersion 35
    defaultConfig {
        applicationId "com.gnxengine.terrain"
        minSdkVersion 24
        targetSdkVersion 35
        versionCode 1
        versionName "1.0"
        externalNativeBuild {
            cmake {
                arguments "-DANDROID_APP_PLATFORM=android-24", "-DANDROID_STL=c++_static"
                abiFilters 'arm64-v8a', 'x86_64', 'x86'
            }
        }
    }
    buildTypes {
        debug {
            // 启用 native (C/C++) 调试，让 LLDB 能找到符号文件
            debuggable true
            jniDebuggable true
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
    sourceSets.main {
        jniLibs.srcDir 'libs'
        assets.srcDirs += shaderOutDir
    }
    externalNativeBuild {
        cmake {
            path 'jni/CMakeLists.txt'
        }
    }
    packagingOptions {
        jniLibs {
            keepDebugSymbols += '**/*.so'
        }
    }
}

dependencies {
}
